[pytest]
testpaths = tests
# Testes lentos (desempenho com o volume máximo) só rodam com: pytest -m lento
addopts = -m "not lento" --strict-markers -ra
markers =
    lento: testes de desempenho com volume máximo (dezenas de segundos); rode com -m lento
    seguranca: entradas maliciosas ou abusivas, pensando no app aberto na internet
xfail_strict = true
