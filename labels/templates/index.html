<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiquetas de código de barras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <main class="sheet">
      <header>
        <p class="eyebrow">Gerador de etiquetas</p>
        <h1>Códigos de barras em PDF</h1>
      </header>

      {% if erro %}
      <p class="alert" role="alert">{{ erro }}</p>
      {% endif %}

      <form id="form-etiquetas" action="{{ url_for('gerar') }}" method="post" enctype="multipart/form-data" data-preview-info-url="{{ url_for('preview_info') }}">
        <fieldset class="range">
          <legend>Intervalo</legend>
          <label>
            Número inicial
            <input type="text" name="inicio" inputmode="numeric" pattern="[0-9]+" required placeholder="12385319" value="{{ inicio or '' }}" autocomplete="off">
          </label>
          <span class="range-sep" aria-hidden="true">→</span>
          <label>
            Número final
            <input type="text" name="fim" inputmode="numeric" pattern="[0-9]+" required placeholder="12385350" value="{{ fim or '' }}" autocomplete="off">
          </label>
        </fieldset>

        <label>
          Texto acima do código
          <input type="text" name="orgao" value="{{ orgao_padrao }}" maxlength="{{ max_orgao }}" placeholder="Deixe vazio para não imprimir texto">
        </label>

        <fieldset class="planilha">
          <legend>Planilha</legend>
          <label>
            Arquivo (.csv, .txt, .xlsx ou .ods)
            <input type="file" name="planilha" id="campo-planilha" accept="{{ formatos }}">
          </label>
          <button type="button" id="remover-planilha" class="botao-secundario" hidden>Remover planilha</button>
          <p class="hint">Um código por linha, na primeira coluna. Com uma planilha, o intervalo fica bloqueado.</p>
        </fieldset>

        <input type="hidden" name="download_token" id="download-token">
        <button type="submit" id="botao-gerar">Gerar PDF</button>
        <!-- Envia o formulário (com a planilha) para o iframe da prévia; acionado pelo preview.js. -->
        <button type="submit" id="botao-preview" hidden formaction="{{ url_for('preview') }}#view=FitH" formtarget="preview-frame" formnovalidate tabindex="-1">Atualizar prévia</button>
      </form>
    </main>

    <aside class="preview" aria-labelledby="preview-titulo">
      <div class="preview-head">
        <p id="preview-titulo" class="eyebrow">Prévia</p>
        <p id="preview-resumo" class="preview-resumo" aria-live="polite">Preencha o intervalo ou importe uma planilha.</p>
      </div>
      <div class="preview-folha" data-estado="vazio">
        <iframe id="preview-frame" name="preview-frame" title="Prévia do PDF" hidden></iframe>
        <p id="preview-mensagem" class="preview-mensagem">As páginas aparecem aqui.</p>
        <div class="preview-carregando" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>Gerando prévia…</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="{{ url_for('static', filename='preview.js') }}"></script>
</body>
</html>
